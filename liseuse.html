<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zhouyi Neizhuan · Liseuse</title>
<style>
@font-face { font-family: "Hexagrammes"; src: url("hexagrammes.ttf"); }
:root {
  --bg: #fbfaf7; --panel: #f1eee7; --text: #2a2622; --muted: #7a7166; --line: #ddd6ca;
  --accent: #8a3b12;
  --c-zh: #a3261b; --c-py: #2d6a4f; --c-sy: #1d5f8a; --c-fr: #6b5e4f;
  --hl-zh: #fbe3df; --hl-py: #dcefe4; --hl-sy: #dbe9f4; --hl-fr: #eee8dd;
  --jing-bg: #f4ede0; --card: #faf8f3;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1916; --panel: #24211d; --text: #ece6dc; --muted: #9c9285; --line: #3a352e;
  --accent: #e0915f;
  --c-zh: #f08b7f; --c-py: #7fcfa3; --c-sy: #8cc3ec; --c-fr: #c9b9a3;
  --hl-zh: #4a2622; --hl-py: #1f3d2e; --hl-sy: #1f3447; --hl-fr: #3a342b;
  --jing-bg: #2b2620; --card: #2c2823;
}}
:root[data-theme="dark"] {
  --bg: #1b1916; --panel: #24211d; --text: #ece6dc; --muted: #9c9285; --line: #3a352e;
  --accent: #e0915f;
  --c-zh: #f08b7f; --c-py: #7fcfa3; --c-sy: #8cc3ec; --c-fr: #c9b9a3;
  --hl-zh: #4a2622; --hl-py: #1f3d2e; --hl-sy: #1f3447; --hl-fr: #3a342b;
  --jing-bg: #2b2620; --card: #2c2823;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 17px/1.65 Cambria, "Noto Serif", "Times New Roman", serif; display: flex; }
/* ---------- barre latérale ---------- */
#side { width: 310px; flex: none; background: var(--panel); border-right: 1px solid var(--line); height: 100vh; overflow-y: auto; padding: 16px 14px 32px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; scrollbar-width: thin; }
#side h2 { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }
#side h2:first-child { margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.card > .row + .row, .term + .term { border-top: 1px solid var(--line); }
.row > label { display: flex; align-items: center; gap: 9px; cursor: pointer; flex: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.hint { color: var(--muted); font-size: 12px; }
.term { padding: 6px 0 10px; }
.term .row { min-height: 34px; }

/* interrupteurs */
input.switch { appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; }
input.switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
input.switch:checked { background: var(--accent); }
input.switch:checked::before { transform: translateX(15px); }
input.switch:focus-visible, .pill button:focus-visible, .chaps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* boutons segmentés */
.pill { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.pill button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 12px/1 system-ui, sans-serif; padding: 7px 4px; border-radius: 7px; cursor: pointer; transition: background .15s, color .15s; }
.pill button:hover { color: var(--text); }
.pill button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* chapitres */
.chaps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chaps button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 9px; padding: 6px 0 5px; cursor: pointer; font: 600 13px/1.1 system-ui, sans-serif; transition: border-color .15s, background .15s; }
.chaps button small { display: block; font: 15px/1.2 "Hexagrammes", "Noto Sans Symbols 2", "Segoe UI Symbol", serif; color: var(--muted); margin-top: 2px; }
.chaps button:hover { border-color: var(--accent); }
.chaps button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chaps button[aria-pressed="true"] small { color: rgba(255,255,255,.8); }
#chapTitle { margin: 10px 4px 0; color: var(--text); font-size: 13px; }
.file { display: inline-block; margin: 6px 4px 0; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline dotted; }
.file:hover { color: var(--accent); }
.file input { display: none; }

/* curseurs */
.slider { padding: 8px 0 10px; }
.slider .top { display: flex; justify-content: space-between; margin-bottom: 8px; }
.slider output { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; margin: 0; cursor: pointer;
  background: linear-gradient(var(--accent), var(--accent)) 0 / var(--pct, 50%) 100% no-repeat, var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.25); }

/* sommaire et liens */
#toc a { display: block; color: var(--text); text-decoration: none; padding: 7px 8px; border-radius: 7px; font-size: 13px; }
#toc a:hover { background: var(--card); color: var(--accent); }
.links a { display: block; color: var(--accent); text-decoration: none; padding: 6px 8px; font-size: 13px; }
.links a:hover { text-decoration: underline; }
#main { flex: 1; height: 100vh; overflow-y: auto; }
#doc { max-width: var(--w, 46em); margin: 0 auto; padding: 32px 24px 120px; }
#doc h1, #doc h2 { font-weight: normal; color: var(--accent); }
#doc h2 { margin-top: 2.2em; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.seg { margin: 1.1em 0; }
.seg.jing { background: var(--jing-bg); padding: .6em .9em; border-left: 3px solid var(--accent); }
.seg p { margin: .25em 0; }
.seg .l-zh { font-family: "Kaiti", "KaiTi", "STKaiti", "Noto Serif CJK TC", serif; font-size: 1.12em; color: var(--c-zh); }
.seg .l-py { font-style: italic; color: var(--c-py); font-size: .92em; }
.seg.jing .l-fr { font-weight: bold; }
details.variante { border: 1px dashed var(--line); border-radius: 6px; margin: 1.5em 0; padding: 0 1em; background: var(--panel); }
details.variante > summary { cursor: pointer; padding: .7em 0; color: var(--muted); font: italic .95em/1.4 system-ui, sans-serif; }
details.variante > summary::before { content: "↳ "; }
details.variante[open] > summary { border-bottom: 1px dashed var(--line); margin-bottom: .5em; }
.callout { border-left: 3px solid var(--muted); padding: .3em .8em; color: var(--muted); }
.t-sy { font-family: "Hexagrammes", "Noto Sans Symbols 2", "Segoe UI Symbol", serif; color: var(--c-sy); }
.t-zh { color: var(--c-zh); }
.t-py { font-style: italic; color: var(--c-py); }
.t-fr { color: var(--c-fr); }
body.mono .t-sy, body.mono .t-zh, body.mono .t-py, body.mono .t-fr { color: inherit; }
.hl-zh .t-zh { background: var(--hl-zh); border-radius: 3px; padding: 0 2px; }
.hl-py .t-py { background: var(--hl-py); border-radius: 3px; padding: 0 2px; }
.hl-sy .t-sy { background: var(--hl-sy); border-radius: 3px; padding: 0 2px; }
.hl-fr .t-fr { background: var(--hl-fr); border-radius: 3px; padding: 0 2px; }
.big-sy .t-sy { font-size: 1.5em; vertical-align: -0.1em; }
#daynight { position: fixed; top: 14px; right: 22px; z-index: 15; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: color .2s, border-color .2s, transform .2s; }
#daynight:hover { color: var(--accent); border-color: var(--accent); transform: rotate(-12deg); }
#daynight:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#daynight .sun, .is-dark #daynight .moon { display: none; }
.is-dark #daynight .sun { display: block; }
/* prononciation : voix et bulle de pinyin */
.voices { display: flex; flex-direction: column; gap: 4px; }
.voices button { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 7px 10px; font: 13px/1.25 system-ui, sans-serif; cursor: pointer; }
.voices button small { color: var(--muted); }
.voices button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
#voicesNote { margin: 6px 0 0; }
#voicesNote:empty { display: none; }
#bulle { position: fixed; z-index: 30; max-width: min(92vw, 520px); background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 10px 12px 8px; font: 13px/1.35 system-ui, sans-serif; }
#bulle[hidden] { display: none; }
.b-chars { display: flex; flex-wrap: wrap; gap: 4px; }
.b-c { border: 0; background: transparent; color: inherit; border-radius: 8px; padding: 4px 6px 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-width: 2.6em; }
.b-c:hover, .b-c:focus-visible { background: var(--bg); outline: none; }
.b-py { color: var(--c-py); font-weight: 600; font-size: 13px; }
.b-zh { font: 26px/1.2 "Kaiti", "KaiTi", "STKaiti", "Noto Serif CJK TC", serif; color: var(--c-zh); }
.b-alt { color: var(--muted); font-size: 10.5px; max-width: 7em; text-align: center; }
.b-trad { margin: 6px 4px 0; color: var(--muted); }
.b-trad i { color: var(--c-py); }
.b-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); }
.b-say { border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 6px 14px; font: 600 12px/1 system-ui, sans-serif; cursor: pointer; }
.b-say:disabled { opacity: .45; cursor: default; }
.b-foot .hint { font-size: 11.5px; }
#burger { display: none; position: fixed; right: 16px; bottom: 16px; z-index: 20; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 22px; }
#msg { color: var(--muted); font-style: italic; }
@media (max-width: 800px) {
  #side { position: fixed; z-index: 10; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.3); }
  #side.open { transform: none; }
  #burger { display: block; }
  #doc { padding: 20px 16px 100px; }
}
</style>
</head>
<body>
<aside id="side">
  <h2>Chapitre</h2>
  <div class="chaps" id="chaps" role="group" aria-label="Chapitres"></div>
  <p id="chapTitle"></p>
  <label class="file">Ouvrir un fichier .md local…<input type="file" id="file" accept=".md,.txt"></label>

  <h2>Lignes des passages</h2>
  <div class="card">
    <div class="row"><label for="k-l-zh"><span class="dot" style="background:var(--c-zh)"></span>Chinois original</label><input type="checkbox" class="switch" id="k-l-zh" data-k="l-zh"></div>
    <div class="row"><label for="k-l-py"><span class="dot" style="background:var(--c-py)"></span>Pinyin intégral</label><input type="checkbox" class="switch" id="k-l-py" data-k="l-py"></div>
    <div class="row"><label for="k-l-fr"><span class="dot" style="background:var(--c-fr)"></span>Traduction</label><input type="checkbox" class="switch" id="k-l-fr" data-k="l-fr"></div>
    <div class="row"><label for="k-only-jing">Texte classique seul</label><input type="checkbox" class="switch" id="k-only-jing" data-k="only-jing"></div>
  </div>

  <h2>Termes dans la traduction</h2>
  <div class="card">
    <div class="term">
      <div class="row"><label for="k-sy"><span class="dot" style="background:var(--c-sy)"></span>Symbole <span class="hint">䷀ ☰</span></label><input type="checkbox" class="switch" id="k-sy" data-k="sy"></div>
      <div class="pill" data-hl="sy"><button data-v="">Simple</button><button data-v="hl">Surligné</button><button data-v="big">Grand</button></div>
    </div>
    <div class="term">
      <div class="row"><label for="k-zh"><span class="dot" style="background:var(--c-zh)"></span>Caractères</label><input type="checkbox" class="switch" id="k-zh" data-k="zh"></div>
      <div class="pill" data-hl="zh"><button data-v="">Simple</button><button data-v="hl">Surligné</button></div>
    </div>
    <div class="term">
      <div class="row"><label for="k-py"><span class="dot" style="background:var(--c-py)"></span>Pinyin</label><input type="checkbox" class="switch" id="k-py" data-k="py"></div>
      <div class="pill" data-hl="py"><button data-v="">Simple</button><button data-v="hl">Surligné</button></div>
    </div>
    <div class="term">
      <div class="row"><label for="k-fr"><span class="dot" style="background:var(--c-fr)"></span>Gloses</label><input type="checkbox" class="switch" id="k-fr" data-k="fr"></div>
      <div class="pill" data-hl="fr"><button data-v="">Simple</button><button data-v="hl">Surligné</button></div>
    </div>
    <div class="row" style="border-top:1px solid var(--line)"><label for="k-mono">Sans couleurs</label><input type="checkbox" class="switch" id="k-mono" data-k="mono"></div>
  </div>

  <h2>Prononciation</h2>
  <div class="card">
    <div class="row"><label for="k-bulle">Pinyin des caractères sélectionnés</label><input type="checkbox" class="switch" id="k-bulle" data-k="bulle"></div>
    <div class="slider" style="border-top:1px solid var(--line)">
      <div class="top">Voix <span class="hint">sur cet appareil</span></div>
      <div class="voices" id="voices"></div>
      <p class="hint" id="voicesNote"></p>
    </div>
    <div class="slider"><div class="top"><label for="debit">Débit de lecture</label><output id="debitOut"></output></div><input type="range" id="debit" min="0.5" max="1.3" step="0.1"></div>
  </div>

  <h2>Mise en page</h2>
  <div class="card">
    <div class="slider"><div class="top"><label for="width">Largeur du texte</label><output id="widthOut"></output></div><input type="range" id="width" min="30" max="80"></div>
    <div class="slider"><div class="top"><label for="size">Taille des caractères</label><output id="sizeOut"></output></div><input type="range" id="size" min="13" max="24"></div>
    <div class="slider"><div class="top">Thème</div><div class="pill" id="theme"><button data-v="">Auto</button><button data-v="light">Clair</button><button data-v="dark">Sombre</button></div></div>
  </div>

  <h2>Sommaire</h2>
  <nav id="toc"></nav>

  <h2>Voir aussi</h2>
  <nav class="links"><a href="./">Présentation du projet</a><a href="_archives/liseuse-v1.html">Ancienne liseuse</a></nav>
</aside>
<main id="main"><article id="doc"><p id="msg">Chargement…</p></article></main>
<button id="burger" aria-label="Menu">☰</button>
<button id="daynight" type="button" aria-label="Passer en mode nuit" title="Jour / nuit">
  <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
</button>
<div id="bulle" role="dialog" aria-label="Prononciation de la sélection" hidden></div>

<script>
const MD_DIR = 'français/markdown/';      // Markdown homogène (voir outils/SYNTAXE.md)
const CHAPTERS = ['00', '1a', '1b', '2a', '2b', '3a', '3b', '4a'];
const DEFAULT_CHAPTER = '1a';             // comme l'ancienne liseuse
const TITLES = {
  '00': 'Principes méthodologiques', '1a': '䷀ Qián – ䷁ Kūn', '1b': '䷂ Zhūn → ䷋ Pǐ',
  '2a': '䷌ Tóng rén → ䷓ Guān', '2b': '䷔ Shìkè → ䷝ Lí', '3a': '䷞ Xián → ䷧ Xiè',
  '3b': '䷨ Sǔn → ䷯ Jǐng', '4a': '䷰ Gé → ䷷ Lǚ'
};
const DEFAULTS = { 'l-zh': true, 'l-py': true, 'l-fr': true, 'only-jing': false,
                   sy: true, zh: true, py: true, fr: true, mono: false,
                   hl: { sy: '', zh: '', py: '', fr: '' }, width: 46, size: 17, theme: '',
                   bulle: true, voix: '', debit: 0.8 };
let S = load();
let blocks = [];

function load() {
  try { return Object.assign(structuredClone(DEFAULTS), JSON.parse(localStorage.getItem('liseuse-nz') || '{}')); }
  catch (e) { return structuredClone(DEFAULTS); }
}
function save() { try { localStorage.setItem('liseuse-nz', JSON.stringify(S)); } catch (e) {} }

/* ---------- analyse du Markdown homogène ---------- */
function parse(md) {
  collectTerms(md);
  const out = [], lines = md.replace(/\r\n/g, '\n').split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^:::\s*(\w+)/))) {
      const seg = { type: 'seg', kind: m[1], rows: [] };
      while (++i < lines.length && !/^:::\s*$/.test(lines[i])) {
        const r = lines[i].match(/^(zh|py|fr):\s?(.*)$/);
        if (r) seg.rows.push([r[1], r[2]]);
      }
      out.push(seg);
    } else if ((m = l.match(/^\+\+\+\s*variante\s*(.*)$/))) out.push({ type: 'var-open', text: m[1] || 'Autre version' });
    else if (/^\+\+\+\s*$/.test(l)) out.push({ type: 'var-close' });
    else if ((m = l.match(/^(#{1,6})\s+(.*)$/))) out.push({ type: 'h', level: m[1].length, text: m[2] });
    else if (/^---+\s*$/.test(l)) out.push({ type: 'hr' });
    else if (/^>/.test(l)) out.push({ type: 'callout', text: l.replace(/^>\s?(\[![^\]]*\]\s*)?/, '') });
    else if (l.trim() && !/^<!--/.test(l)) out.push({ type: 'p', text: l });
  }
  return out;
}

/* ---------- rendu ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function fieldsOf(body) {
  const f = { sy: '', zh: '', py: '', fr: '' };
  body.split(' | ').forEach(p => { const k = p.slice(0, 2); if (k in f && p[2] === ':') f[k] = p.slice(3); });
  return f;
}
function spans(f, keys) {
  return keys.filter(k => f[k]).map(k => `<span class="t-${k}">${esc(f[k])}</span>`).join(' ');
}
const ORDER = ['sy', 'zh', 'py', 'fr'];
function inline(text) {
  const parts = [];
  text = text.replace(/\{\{([^{}]*)\}\}|\{([^{}]*)\}/g, (m, term, ann) => {
    const f = fieldsOf(term ?? ann);
    let html;
    if (term !== undefined) {
      let keys = ORDER.filter(k => S[k] && f[k] && k !== 'fr');
      if (!keys.length) keys = ['py', 'zh', 'sy'].filter(k => f[k]).slice(0, 1);
      html = `<span class="term">${spans(f, keys)}</span>`;
    } else {
      const keys = ORDER.filter(k => S[k] && f[k]);
      html = keys.length ? ` <span class="ann">(${spans(f, keys).replace(/<\/span> <span class="t-fr">/, '</span>, <span class="t-fr">')})</span>` : '';
    }
    parts.push(html);
    return '\u0000' + (parts.length - 1) + '\u0000';
  });
  text = esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  return text.replace(/\s*\u0000(\d+)\u0000/g, (m, n) => (m.startsWith(' ') || parts[n].startsWith(' ') ? '' : '') + parts[n])
             .replace(/ +(<span class="ann">)/g, ' $1').replace(/\( /g, '(');
}

function render() {
  const doc = document.getElementById('doc'), toc = document.getElementById('toc');
  let html = '', tocHtml = '', n = 0, inVar = false;
  for (const b of blocks) {
    if (b.type === 'h') {
      const id = 'h' + (n++);
      html += `<h${b.level} id="${id}">${inline(b.text)}</h${b.level}>`;
      if (b.level <= 3 && !inVar) tocHtml += `<a href="#${id}">${inline(b.text)}</a>`;
    } else if (b.type === 'var-open') { html += `<details class="variante"><summary>${inline(b.text)}</summary>`; inVar = true; }
    else if (b.type === 'var-close') { if (inVar) html += '</details>'; inVar = false; }
    else if (b.type === 'hr') html += '<hr>';
    else if (b.type === 'callout') html += `<p class="callout">${inline(b.text)}</p>`;
    else if (b.type === 'p') html += `<p>${inline(b.text)}</p>`;
    else if (b.type === 'seg') {
      if (S['only-jing'] && b.kind !== 'jing') continue;
      let rows = '';
      for (const [k, v] of b.rows) {
        if (!S['l-' + k]) continue;
        rows += `<p class="l-${k}">${k === 'fr' ? inline(v) : esc(v)}</p>`;
      }
      if (rows) html += `<section class="seg ${b.kind}">${rows}</section>`;
    }
  }
  doc.innerHTML = html || '<p id="msg">Rien à afficher avec ces réglages.</p>';
  toc.innerHTML = tocHtml;
}

function applyLook() {
  const c = document.body.classList;
  c.toggle('mono', S.mono);
  for (const k of ['sy', 'zh', 'py', 'fr']) c.toggle('hl-' + k, S.hl[k] === 'hl');
  c.toggle('big-sy', S.hl.sy === 'big');
  document.documentElement.style.setProperty('--w', S.width + 'em');
  document.body.style.fontSize = S.size + 'px';
  if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme;
  const dark = isDark();
  document.documentElement.classList.toggle('is-dark', dark);
  const dn = document.getElementById('daynight');
  if (dn) dn.setAttribute('aria-label', dark ? 'Passer en mode jour' : 'Passer en mode nuit');
}
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function isDark() { return S.theme ? S.theme === 'dark' : darkMQ.matches; }
darkMQ.addEventListener?.('change', () => { if (!S.theme) applyLook(); });

/* ---------- chargement ---------- */
async function loadChapter(id) {
  document.getElementById('doc').innerHTML = '<p id="msg">Chargement…</p>';
  try {
    const r = await fetch(`${MD_DIR}${id}.md`);
    if (!r.ok) throw new Error(r.status);
    blocks = parse(await r.text());
    render();
    document.getElementById('main').scrollTop = 0;
  } catch (e) {
    document.getElementById('doc').innerHTML =
      '<p id="msg">Impossible de lire ' + MD_DIR + id + '.md (' + esc(String(e.message || e)) +
      '). Ouvrez la page via un serveur web, ou choisissez le fichier avec « ouvrir un fichier ».</p>';
  }
}

/* ---------- interface ---------- */
let current = null;
const chapsEl = document.getElementById('chaps');
function selectChapter(id, push = true) {
  current = id;
  chapsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
  document.getElementById('chapTitle').textContent = TITLES[id] || '';
  if (push) history.replaceState(null, '', '?ch=' + id);
  loadChapter(id);
}
CHAPTERS.forEach(c => {
  const b = document.createElement('button');
  b.dataset.id = c; b.title = TITLES[c] || c;
  b.innerHTML = `${c}<small>${(TITLES[c] || '').match(/[䷀-䷿]/)?.[0] || '·'}</small>`;
  b.onclick = () => { selectChapter(c); if (innerWidth <= 800) setOpen(false); };
  chapsEl.appendChild(b);
});
document.getElementById('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  chapsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', false));
  document.getElementById('chapTitle').textContent = f.name;
  blocks = parse(await f.text()); render();
};
document.querySelectorAll('input[data-k]').forEach(cb => {
  cb.checked = S[cb.dataset.k];
  cb.onchange = () => { S[cb.dataset.k] = cb.checked; save(); applyLook(); render(); syncPills(); };
});
function pill(el, value, onPick) {
  const set = v => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  set(value);
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; set(b.dataset.v); onPick(b.dataset.v); };
  return set;
}
document.querySelectorAll('.pill[data-hl]').forEach(el =>
  pill(el, S.hl[el.dataset.hl] || '', v => { S.hl[el.dataset.hl] = v; save(); applyLook(); }));
function syncPills() {   // style inutile quand le champ est masqué
  document.querySelectorAll('.pill[data-hl]').forEach(el => el.style.opacity = S[el.dataset.hl] ? 1 : .45);
}
syncPills();
for (const [id, unit] of [['width', ' em'], ['size', ' px'], ['debit', ' ×']]) {
  const el = document.getElementById(id), out = document.getElementById(id + 'Out');
  const show = () => { out.textContent = el.value + unit; el.style.setProperty('--pct', (el.value - el.min) / (el.max - el.min) * 100 + '%'); };
  el.value = S[id]; show();
  el.oninput = () => { S[id] = +el.value; save(); applyLook(); show(); };
}
const setThemePill = pill(document.getElementById('theme'), S.theme, v => { S.theme = v; save(); applyLook(); });
document.getElementById('daynight').onclick = () => {
  S.theme = isDark() ? 'light' : 'dark';
  save(); applyLook(); setThemePill(S.theme);
};
const side = document.getElementById('side');
const burger = document.getElementById('burger');
const setOpen = o => { side.classList.toggle('open', o); burger.textContent = o ? '✕' : '☰'; };
burger.onclick = () => setOpen(!side.classList.contains('open'));
document.getElementById('main').addEventListener('click', () => { if (side.classList.contains('open')) setOpen(false); });
document.getElementById('toc').onclick = e => { if (e.target.closest('a') && innerWidth <= 800) setOpen(false); };

applyLook();
/* ---------- prononciation : pinyin à la sélection, voix locales ----------
   Tout reste dans le navigateur : la table donnees/pinyin.json est servie avec la liseuse
   (base Unihan, voir donnees/LISEZMOI.md) et seules les voix installées sur l'appareil
   (localService) sont proposées : aucune voix « en ligne » qui enverrait le texte ailleurs. */
const PY = {};
fetch('donnees/pinyin.json').then(r => r.ok ? r.json() : {}).then(t => Object.assign(PY, t)).catch(() => {});
const HANRE = /[㐀-䶿一-鿿豈-﫿\u{20000}-\u{3134f}]/u;
let terms = new Map();          // caractères -> pinyin choisi par la traduction (chapitre courant)
function collectTerms(md) {
  terms = new Map();
  for (const m of md.matchAll(/\{\{?([^{}]*)\}\}?/g)) {
    const f = fieldsOf(m[1]);
    const zh = (f.zh || '').replace(/[《》「」]/g, '');
    if (zh && f.py && !terms.has(zh)) terms.set(zh, f.py);
  }
}

let voices = [], onlineVoices = 0;
const hasTTS = 'speechSynthesis' in window;
function loadVoices() {
  const all = hasTTS ? speechSynthesis.getVoices() : [];
  const zh = all.filter(v => /^(zh|cmn)/i.test(v.lang));
  voices = zh.filter(v => v.localService);
  onlineVoices = zh.length - voices.length;
  renderVoices();
}
function currentVoice() {
  return voices.find(v => v.name === S.voix) || voices.find(v => /CN|Hans/i.test(v.lang)) || voices[0] || null;
}
function voiceLabel(v) {
  const lang = /HK/i.test(v.lang) ? 'cantonais, Hong Kong' : /TW|Hant/i.test(v.lang) ? 'mandarin, Taïwan' : 'mandarin';
  return `${esc(v.name.replace(/^Microsoft\s+|\s*-\s*Chinese.*$/g, ''))} <small>${lang}</small>`;
}
function renderVoices() {
  const box = document.getElementById('voices'), note = document.getElementById('voicesNote');
  const cur = currentVoice();
  box.innerHTML = voices.map(v => `<button data-name="${esc(v.name)}" aria-pressed="${v === cur}">${voiceLabel(v)}</button>`).join('');
  let msg = '';
  if (!hasTTS) msg = 'Ce navigateur ne propose pas de synthèse vocale.';
  else if (!voices.length) msg = 'Aucune voix chinoise installée sur cet appareil. Sous Windows : Paramètres → Heure et langue → Langue et région → ajouter « Chinois (simplifié, Chine) » avec l’option Voix. Sous macOS : Réglages → Accessibilité → Contenu énoncé → Voix du système.';
  if (onlineVoices) msg += (msg ? ' ' : '') + `${onlineVoices} voix « en ligne » ignorée${onlineVoices > 1 ? 's' : ''} : elles enverraient le texte à un service extérieur.`;
  note.textContent = msg;
}
document.getElementById('voices').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.voix = b.dataset.name; save(); renderVoices(); speak('乾元亨利貞');
};
if (hasTTS) { loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }
else renderVoices();

function speak(text) {
  const v = currentVoice();
  if (!v || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = v; u.lang = v.lang; u.rate = S.debit;
  speechSynthesis.speak(u);
}

const bulle = document.getElementById('bulle');
let bulleText = '';
function hideBulle() { bulle.hidden = true; bulleText = ''; }
function showBulle(text, rect) {
  const chars = [...text].filter(c => HANRE.test(c)).slice(0, 40);
  if (!chars.length) return hideBulle();
  bulleText = chars.join('');
  const cells = chars.map(c => {
    const r = (PY[c] || '').split(' ').filter(Boolean);
    return `<button class="b-c" data-c="${c}" title="Écouter ${c}"><span class="b-py">${esc(r[0] || '?')}</span>` +
           `<span class="b-zh">${c}</span>${r.length > 1 ? `<span class="b-alt">${esc(r.slice(1).join(' · '))}</span>` : ''}</button>`;
  }).join('');
  const trad = terms.get(bulleText);
  const v = currentVoice();
  bulle.innerHTML = `<div class="b-chars">${cells}</div>` +
    (trad ? `<p class="b-trad">Lecture retenue dans la traduction : <i>${esc(trad)}</i></p>` : '') +
    `<div class="b-foot"><span class="hint">${chars.length > 1 ? 'Cliquez un caractère pour l’entendre seul' : 'Lectures possibles sous le caractère'}</span>` +
    `<button class="b-say" ${v ? '' : 'disabled title="Aucune voix chinoise locale"'}>🔊 Écouter</button></div>`;
  bulle.hidden = false;
  const w = bulle.offsetWidth, h = bulle.offsetHeight;
  let left = rect.left + rect.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  let top = rect.top - h - 10;
  if (top < 8) top = rect.bottom + 10;
  bulle.style.left = left + 'px'; bulle.style.top = Math.min(top, innerHeight - h - 8) + 'px';
}
bulle.addEventListener('mousedown', e => e.preventDefault());   // garder la sélection
bulle.onclick = e => {
  const c = e.target.closest('.b-c');
  if (c) return speak(c.dataset.c);
  if (e.target.closest('.b-say')) speak(bulleText);
};
let selTimer;
document.addEventListener('selectionchange', () => {
  clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    if (!S.bulle) return hideBulle();
    const sel = getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return hideBulle();
    const range = sel.getRangeAt(0);
    if (!document.getElementById('doc').contains(range.commonAncestorContainer)) return hideBulle();
    const text = sel.toString();
    if (text === bulleText && !bulle.hidden) return;
    showBulle(text, range.getBoundingClientRect());
  }, 220);
});
document.getElementById('main').addEventListener('scroll', hideBulle, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideBulle(); });

/* Liens publies avec l'ancienne liseuse :
   liseuse.html?post=https://…/français/html-balises/1atag.html  ->  chapitre 1a */
function startChapter() {
  const q = new URLSearchParams(location.search);
  let id = q.get('ch');
  const post = q.get('post');
  if (!id && post) {
    const m = decodeURIComponent(post).match(/([0-9]{1,2}[ab]?)(?:tag)?\.(?:html|md)\s*$/i);
    if (m) id = m[1].replace(/^0(?=\d[ab])/, '');
  }
  return CHAPTERS.includes(id) ? id : DEFAULT_CHAPTER;
}
selectChapter(startChapter(), false);
</script>
